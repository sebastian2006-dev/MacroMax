# ─────────────────────────────────────────────────────────────────────────────
# MacroMax — CI pipeline
#
# Triggers:
#   • Every push to `main` or any feature/* branch
#   • Every Pull Request targeting `main`
#
# Jobs
#   1. lint-typecheck  — TypeScript strict type-checking (tsc --noEmit)
#   2. unit-tests      — 182 pure unit tests against the real src/lib modules
#                        (Node built-in runner via tsx). Suites: nutrition,
#                        servingUnits, fallbackFoods, food-search pipeline
#                        (api), Open Food Facts mapping, FatSecret mapping,
#                        sync-status store, HTTP helpers.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

# Cancel in-flight runs for the same ref to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: TypeScript strict type-checking ─────────────────────────────────
  lint-typecheck:
    name: "TypeScript — tsc --noEmit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

  # ── Job 2: Unit tests ──────────────────────────────────────────────────────
  unit-tests:
    name: "Unit Tests (182 tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*.log"
          retention-days: 7
