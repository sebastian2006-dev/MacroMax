# ─────────────────────────────────────────────────────────────────────────────
# MacroMax — CI pipeline
#
# Triggers:
#   • Every push to `main` or any feature/** branch
#   • Every Pull Request targeting `main`
#
# One job, strictly sequential gates (an early failure skips the rest):
#   1. lint       — ESLint (expo flat config, --max-warnings 0)
#   2. typecheck  — tsc --noEmit (strict; global.d.ts is committed so the
#                   '../global.css' side-effect import resolves on a fresh
#                   checkout — see that file for the TS2882 history)
#   3. tests      — pure unit suites against the real src/lib modules
#                   (Node's built-in runner via tsx): nutrition engine,
#                   goal parsing, serving units, search pipeline, OFF/FatSecret
#                   mapping, backup payload sanitization, greeting buckets,
#                   walkthrough content, trend-series axis math, theme
#                   contrast (WCAG) + ring palette guards, tab-bar layout.
#
# The optional `bundle` job compiles the Metro bundle exactly the way a device
# requests it. It catches unresolvable imports (e.g. a bad asset path) that
# typecheck cannot see — those otherwise surface as a red "server returned
# 500" screen on the phone. It runs after the gates pass, on pushes to main.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

# Cancel in-flight runs for the same ref to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Lint → Typecheck → Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Upload test output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: "*.log"
          retention-days: 7
          if-no-files-found: ignore

  bundle:
    name: "Metro bundle smoke check"
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start Metro and compile the Android dev bundle
        run: |
          npx expo export --platform android --output-dir .ci-bundle > export.log 2>&1 || {
            echo "── Metro export failed ──"
            tail -n 40 export.log
            exit 1
          }
          echo "Bundle compiled successfully."

      - name: Upload export log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metro-export-log
          path: export.log
          retention-days: 7
