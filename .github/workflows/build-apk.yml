# ─────────────────────────────────────────────────────────────────────────────
# MacroMax — Build APK (no EAS)
#
# Why this exists: `android/` is git-ignored build output, so a fresh checkout
# has no native project at all. EAS Build regenerates it in the cloud with an
# Expo account and its own signing credentials; this workflow does the same two
# steps on a GitHub runner with nothing but the repo:
#
#   1. `expo prebuild`  — config (app.json + app.config.js plugins) → native project
#   2. `gradlew :app:assembleRelease` — the R8/shrunk, ARM-only release build
#
# No Expo account, no EAS quota, no local Android SDK, no expo.dev login.
#
# Triggers
#   • Actions → "Build APK" → Run workflow   (manual; pick ABIs + artifact)
#   • push a tag matching `v*`               (builds, then publishes a GitHub Release)
#
# Manual inputs
#   abis      arm-only   arm64-v8a + armeabi-v7a — every ARM phone since 2017 (default)
#             all-abis   adds x86/x86_64 so an emulator can install the APK too
#   artifact  apk        installable APK (default)
#             aab        app bundle for Play Console
#             both       both of the above
#   publish_release  false (default) build only; true ALSO publishes a GitHub
#                    Release with the artifact attached, so a manual run no
#                    longer costs a trip to the Artifacts list. The tag is
#                    release_tag, or v<app.json version> when left blank.
#   release_tag      tag for a manual publish (also accepted as "1.2.3")
#   prerelease       mark the published release as a pre-release
#
# Signing
#   Out of the box the APK is signed with the debug key the Expo template ships
#   (exactly what `expo run:android --variant release` gives you locally), which
#   installs on any phone but is not accepted by Play. Set the three
#   RELEASE_KEYSTORE_* secrets (see README) to re-sign with your own release key.
# ─────────────────────────────────────────────────────────────────────────────
name: Build APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "Native ABIs to package (arm-only = every ARM phone since 2017)"
        type: choice
        default: arm-only
        options:
          - arm-only
          - all-abis
      artifact:
        description: "Artifact to build"
        type: choice
        default: apk
        options:
          - apk
          - aab
          - both
      publish_release:
        description: "Also publish a GitHub Release with the built artifact"
        type: boolean
        default: false
      release_tag:
        description: "Release tag for a manual publish (blank = v<app.json version>)"
        type: string
        default: ""
      prerelease:
        description: "Mark the published release as a pre-release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# Least privilege by default; the release job opts into `contents: write`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a build half way: a tag build is a release.
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  # AGP 8.12 / Gradle 9 minimum. Deliberately not `latest`: newer JDKs need
  # extra native-access flags for the prefab/CMake step of the RN toolchain.
  JAVA_VERSION: "17"

jobs:
  # ── Gate ────────────────────────────────────────────────────────────────────
  # An APK is only as good as the source it came from, so the same checks CI
  # runs (lint → strict typecheck → unit tests) run first and block the build.
  verify:
    name: "Lint → Type-check → Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }} LTS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Gates (lint + typecheck + tests)
        run: npm run ci

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: "Build ${{ inputs.artifact || 'apk' }} · ${{ inputs.abis || 'arm-only' }}"
    runs-on: ubuntu-latest
    needs: verify

    env:
      # Consumed by app.config.js: physical → ARM-only, emulator → all four ABIs.
      # For a tag build (no inputs) this falls through to ARM-only as well.
      BUILD_TARGET: ${{ inputs.abis == 'all-abis' && 'emulator' || 'physical' }}
      BUILD_ARTIFACT: ${{ inputs.artifact || 'apk' }}

      # Optional provider keys for tier-3 (online) text search. Unset secrets
      # arrive as empty strings and the app degrades to its offline tiers, so
      # the pipeline works with no secrets configured at all.
      EXPO_PUBLIC_FATSECRET_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_FATSECRET_CLIENT_ID }}
      EXPO_PUBLIC_FATSECRET_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_FATSECRET_CLIENT_SECRET }}
      EXPO_PUBLIC_FATSECRET_REGION: ${{ secrets.EXPO_PUBLIC_FATSECRET_REGION }}
      EXPO_PUBLIC_OFF_USER_AGENT: ${{ secrets.EXPO_PUBLIC_OFF_USER_AGENT }}

      # Optional: re-sign the build with a real release key (Play rejects debug
      # signing). All three must be set for the re-sign step to run.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }} LTS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build plan
        run: |
          {
            echo "### MacroMax build plan"
            echo
            echo "| setting | value |"
            echo "| --- | --- |"
            if [ "$BUILD_TARGET" = "physical" ]; then
              echo "| ABIs | \`arm64-v8a\`, \`armeabi-v7a\` (real phones) |"
            else
              echo "| ABIs | \`arm64-v8a\`, \`armeabi-v7a\`, \`x86\`, \`x86_64\` (emulators included) |"
            fi
            echo "| Artifact | \`$BUILD_ARTIFACT\` |"
            echo "| FatSecret keys | $([ -n "${EXPO_PUBLIC_FATSECRET_CLIENT_ID:-}" ] && echo 'present' || echo 'not set — FatSecret text search disabled, Open Food Facts + offline tiers still active') |"
            echo "| Release keystore | $([ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && echo 'present' || echo 'not set — template debug key') |"
          } >> "$GITHUB_STEP_SUMMARY"

      # app.json + app.config.js → android/. This is the step EAS would do in the
      # cloud. `--no-install` because dependencies were just installed; the SDK 57
      # CLI recreates the native project by default (the opt-out is `--no-clean`,
      # there is no `--clean` flag), which is what we want on a fresh runner.
      - name: Generate the native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Re-apply the launcher and boot-splash artwork
        run: npm run build:icons

      # Fail here, loudly, instead of shipping an APK that silently lost R8, the
      # Android 7 floor or the ARM ABI set — the config lives in app.config.js
      # and its only proof is what lands in the generated gradle.properties.
      - name: Assert the release settings landed in android/
        run: |
          set -euo pipefail

          check() {
            local line
            line=$(grep -E "^$1=" android/gradle.properties || true)
            if [ "$line" != "$1=$2" ]; then
              echo "::error file=app.config.js::android/gradle.properties has '$line', expected '$1=$2'"
              exit 1
            fi
          }

          if [ "$BUILD_TARGET" = "physical" ]; then
            check reactNativeArchitectures "arm64-v8a,armeabi-v7a"
          else
            check reactNativeArchitectures "arm64-v8a,armeabi-v7a,x86,x86_64"
          fi
          check android.minSdkVersion 24
          check android.enableMinifyInReleaseBuilds true
          check android.enableShrinkResourcesInReleaseBuilds true
          check android.enablePngCrunchInReleaseBuilds true

          grep -q "com.swmansion.reanimated" android/app/proguard-rules.pro || {
            echo "::error file=plugins/android-proguard-rules.pro::the committed R8 keeps are missing from the generated proguard-rules.pro"
            exit 1
          }

          grep -vE '^$' android/gradle.properties | sed -E 's/^/  /'

      # The Expo template ships -Xmx2048m -XX:MaxMetaspaceSize=512m, which OOMs
      # (Java heap) in ksp/lintVital/R8 on this project. A runner has ~7 GB, so
      # give the daemon room. android/ is generated, so this is per-job only.
      - name: Give Gradle enough memory
        run: |
          set -euo pipefail
          sed -i -E 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g|' android/gradle.properties
          grep '^org.gradle.jvmargs' android/gradle.properties

      # Reanimated/Worklets/Expo Modules compile C++ with CMake, so the NDK
      # version React Native pins (gradle/libs.versions.toml of the RN package)
      # has to exist. GitHub images ship NDK/CMake builds, but not necessarily
      # this exact one — install it up front instead of letting AGP fetch it
      # mid-build. Licenses are pre-accepted on hosted runners.
      - name: Ensure the NDK and CMake the toolchain expects
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::warning::No Android SDK on this runner; leaving NDK/CMake resolution to Gradle."
            exit 0
          fi

          NDK_VERSION=$(grep -E '^[[:space:]]*ndkVersion[[:space:]]*=' node_modules/react-native/gradle/libs.versions.toml \
            | head -1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -z "$NDK_VERSION" ]; then
            echo "::warning::Could not read ndkVersion from react-native; leaving it to Gradle."
            exit 0
          fi

          TO_INSTALL=""
          [ -d "$SDK_ROOT/ndk/$NDK_VERSION" ] || TO_INSTALL="ndk;$NDK_VERSION"
          [ -d "$SDK_ROOT/cmake/3.22.1" ] || TO_INSTALL="$TO_INSTALL cmake;3.22.1"

          if [ -n "${TO_INSTALL// /}" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SDKMANAGER" ] || SDKMANAGER=$(command -v sdkmanager || true)
            if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
              echo "Installing:$TO_INSTALL"
              # Answer the licence prompts with `yes`, but judge the result by
              # sdkmanager's own status: when it exits early, `yes` dies from
              # SIGPIPE and `pipefail` would blame the wrong process.
              set +o pipefail
              yes | "$SDKMANAGER" $TO_INSTALL > /dev/null
              INSTALL_STATUS=${PIPESTATUS[1]}
              set -o pipefail
              if [ "$INSTALL_STATUS" -ne 0 ]; then
                echo "::error::sdkmanager failed ($INSTALL_STATUS) installing:$TO_INSTALL"
                exit 1
              fi
            else
              # Not fatal: AGP can still fetch what it needs itself.
              echo "::warning::No sdkmanager available; letting Gradle resolve:$TO_INSTALL"
            fi
          fi

          echo "NDK $NDK_VERSION: $([ -d "$SDK_ROOT/ndk/$NDK_VERSION" ] && echo present || echo missing)"

      - name: Build the release (${{ env.BUILD_ARTIFACT }})
        working-directory: android
        run: |
          set -euo pipefail

          case "$BUILD_ARTIFACT" in
            apk)  TASKS=":app:assembleRelease" ;;
            aab)  TASKS=":app:bundleRelease" ;;
            both) TASKS=":app:assembleRelease :app:bundleRelease" ;;
            *)    echo "::error::Unknown artifact '$BUILD_ARTIFACT'"; exit 1 ;;
          esac

          echo "Running: ./gradlew $TASKS"
          ./gradlew $TASKS --stacktrace

      # A green build is not proof the artifact is right: check what is actually
      # inside the zip (ABIs), that it is 16 KB aligned (Play requirement on
      # Android 15+) and that it is signed before calling it installable.
      - name: Verify the artifact
        run: |
          set -euo pipefail

          OUT="android/app/build/outputs"
          APK=$(find "$OUT/apk/release" -name '*.apk' 2>/dev/null | head -1 || true)

          # Read before the artifact table so the mapping shows up in it.
          MAPPING="$OUT/mapping/release/mapping.txt"
          MAPPING_LINES=""
          if [ -f "$MAPPING" ]; then
            MAPPING_LINES=$(wc -l < "$MAPPING")
            echo "R8 mapping: $MAPPING_LINES lines (needed to de-minify any crash trace)"
          else
            echo "::warning::No R8 mapping.txt — R8 did not run?"
          fi

          if [ -n "$APK" ]; then
            echo "APK: $APK ($(du -h "$APK" | cut -f1))"

            ABIS=$(unzip -l "$APK" | grep -oE 'lib/[^/]+/' | sort -u | sed -E 's|lib/||; s|/||')
            echo "Bundled ABIs:"
            echo "$ABIS" | sed -E 's/^/  /'

            for abi in arm64-v8a armeabi-v7a; do
              echo "$ABIS" | grep -qx "$abi" || { echo "::error::$abi is missing from the APK"; exit 1; }
            done
            if [ "$BUILD_TARGET" = "physical" ]; then
              if echo "$ABIS" | grep -qE '^x86'; then
                echo "::error::x86 payload in a physical-device build — app.config.js buildArchs policy regressed"
                exit 1
              fi
            fi

            # Alignment and signature belong in the summary, not just the log:
            # they are what makes the APK installable, and the summary is what
            # is read a month later when the artifact is downloaded.
            ALIGNMENT="not checked (zipalign unavailable)"
            ZIPALIGN=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name zipalign 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$ZIPALIGN" ]; then
              if "$ZIPALIGN" -c -P 16 4 "$APK" > /dev/null 2>&1; then
                ALIGNMENT="OK (16 KB pages)"
              else
                ALIGNMENT="NOT 16 KB page aligned"
                echo "::warning::$ALIGNMENT — Android 15+ and Play require page-aligned native libs"
              fi
              echo "16 KB page alignment: $ALIGNMENT"
            else
              echo "::warning::zipalign not found; skipped the 16 KB alignment check"
            fi

            SIGNER="not checked (apksigner unavailable)"
            APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$APKSIGNER" ]; then
              # Dump to a file instead of `| head`: cutting a pipe short makes
              # apksigner die with SIGPIPE, which `pipefail` would report as a
              # failed build. An unverifiable APK is genuinely fatal.
              "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"
              head -6 "$RUNNER_TEMP/apksigner.txt"
              SIGNER=$(grep -m1 -a 'certificate DN' "$RUNNER_TEMP/apksigner.txt" | sed -E 's/.*certificate DN: //' || true)
              [ -n "$SIGNER" ] || SIGNER="unknown"
            else
              echo "::warning::apksigner not found; skipped the signature check"
            fi

            SIZE_MB=$(( $(stat -c %s "$APK") / 1024 / 1024 ))
            SHA=$(sha256sum "$APK" | cut -d' ' -f1)
            echo "APK size: ${SIZE_MB} MiB"
            echo "APK sha256: $SHA"
            if [ "$SIZE_MB" -gt 90 ]; then
              echo "::warning::APK grew to ${SIZE_MB} MiB — check the R8 switches and the ARM-only ABI policy"
            fi

            {
              echo
              echo "### Artifact checks"
              echo
              echo "| check | value |"
              echo "| --- | --- |"
              echo "| file | \`$(basename "$APK")\` |"
              echo "| ABIs | \`$(echo "$ABIS" | paste -sd ', ' -)\` |"
              echo "| size | ${SIZE_MB} MiB |"
              echo "| 16 KB alignment | ${ALIGNMENT} |"
              echo "| signed by | ${SIGNER} |"
              echo "| R8 mapping | ${MAPPING_LINES:-missing (R8 did not run?)} lines |"
              echo "| sha256 | \`$SHA\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Signing config is applied to the APK (an AAB has no debug-signed step
      # here), so this only applies when one was actually built.
      - name: Re-sign with the release keystore (only if configured)
        if: env.RELEASE_KEYSTORE_BASE64 != '' && env.BUILD_ARTIFACT != 'aab'
        run: |
          set -euo pipefail

          APK=$(find android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "::error::No APK to sign — build the APK artifact first"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEYSTORE_ALIAS" \
            --key-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --out "$RUNNER_TEMP/app-release-signed.apk" \
            "$APK"

          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/app-release-signed.apk" > "$RUNNER_TEMP/apksigner-signed.txt"
          head -6 "$RUNNER_TEMP/apksigner-signed.txt"

          rm -f "$KEYSTORE"
          cp "$RUNNER_TEMP/app-release-signed.apk" "$APK"

      - name: Stage artifacts
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./app.json').expo.version")
          SUFFIX=$([ "$BUILD_TARGET" = "physical" ] && echo "arm" || echo "all-abis")
          mkdir -p dist

          APK=$(find android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1 || true)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -1 || true)
          [ -n "$APK" ] && cp "$APK" "dist/MacroMax-${VERSION}-${SUFFIX}.apk" || true
          [ -n "$AAB" ] && cp "$AAB" "dist/MacroMax-${VERSION}-${SUFFIX}.aab" || true

          {
            echo "MacroMax $VERSION ($SUFFIX)"
            echo "commit:     $GITHUB_SHA"
            echo "run:        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "ref:        $GITHUB_REF"
            echo "file:       $GITHUB_WORKFLOW"
            echo "signed:     $([ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && echo 'release keystore' || echo 'template debug key')"
          } > dist/BUILD-INFO.txt

          cp android/app/build/outputs/mapping/release/mapping.txt dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload the APK
        if: env.BUILD_ARTIFACT != 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: macromax-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the app bundle
        if: env.BUILD_ARTIFACT != 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: macromax-aab
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload the R8 mapping + build info
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: |
            dist/BUILD-INFO.txt
            dist/mapping.txt
          if-no-files-found: warn
          retention-days: 90

  # ── Release ─────────────────────────────────────────────────────────────────
  # Tagging `v1.2.3` both builds and publishes: the CD half of the pipeline.
  # A manual run can publish too — that is what `publish_release` is for; the
  # tag-only condition this job used to carry meant every hand-triggered build
  # silently skipped it and left you downloading the APK from Artifacts.
  release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    permissions:
      contents: write

    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Flatten macromax-apk/ and build-metadata/ into one directory.
          merge-multiple: true

      - name: Resolve the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual publish: the run's ref is a branch, so the tag has to come
            # from the input or from app.json's version.
            DEFAULT_TAG="v$(node -p "require('./app.json').expo.version")"
            TAG="${INPUT_TAG:-$DEFAULT_TAG}"
            # Accept a bare "1.2.3" as well as "v1.2.3".
            case "$TAG" in
              v*) ;;
              *) TAG="v$TAG" ;;
            esac
          else
            TAG="$GITHUB_REF_NAME"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$TAG' is not a valid release tag — expected v<major>.<minor>.<patch>"
            exit 1
          fi

          echo "Publishing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          find dist -type f | sort

          ASSETS=$(find dist -type f \( -name '*.apk' -o -name '*.aab' -o -name 'BUILD-INFO.txt' -o -name 'mapping.txt' \))
          BINARIES=$(find dist -type f \( -name '*.apk' -o -name '*.aab' \))
          if [ -z "$ASSETS" ] || [ -z "$BINARIES" ]; then
            echo "::error::No APK/AAB in the downloaded artifacts — nothing installable to publish"
            exit 1
          fi

          FLAGS=""
          if [ "${PRERELEASE:-false}" = "true" ]; then
            FLAGS="--prerelease"
          fi

          # Re-running the same tag should update the release, not fail on it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $ASSETS
          else
            # --target cuts the tag at the commit this run actually built (a
            # manual dispatch has no tag yet; a tag push already has one).
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MacroMax $TAG" \
              --generate-notes \
              $FLAGS \
              $ASSETS
          fi

          {
            echo "### Release"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| tag | \`$TAG\` |"
            echo "| trigger | ${{ github.event_name }} |"
            echo "| assets | \`$(echo "$BINARIES" | xargs -n1 basename | paste -sd ', ' -)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
